name: Patch v0.20.2 Version Contracts

on:
  push:
    branches:
      - agent/all-laws-governed-rag-onboarding
    paths:
      - scripts/patch-v0202-version-contracts.mjs
      - .github/workflows/patch-v0202-version-contracts.yml

permissions:
  contents: write

jobs:
  patch-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/all-laws-governed-rag-onboarding
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch release-version contracts
        run: node scripts/patch-v0202-version-contracts.mjs

      - name: Commit contract updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update v0.20 release contract assertions"
          git push origin HEAD:agent/all-laws-governed-rag-onboarding
