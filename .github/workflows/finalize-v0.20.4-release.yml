name: Finalize v0.20.4 Prerelease Record

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.20.4-release.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Finalize published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.20.4-prototype.1
          RELEASE_TITLE: GrowWithHR v0.20.4-prototype.1 — Founder Intelligence, Guided Assessment and Report Parity
          NOTES_FILE: docs/releases/v0.20.4-prototype.1-founder-intelligence-ux-report.md
        shell: bash
        run: |
          set -euo pipefail
          cp "$NOTES_FILE" /tmp/release-notes.md
          sed -i 's/- \[ \] create `v0.20.4-prototype.1` tag on the final validated release SHA;/- [x] create `v0.20.4-prototype.1` tag on the final validated release SHA;/' /tmp/release-notes.md
          sed -i 's/- \[ \] publish GitHub Release as \*\*Pre-release\*\* and \*\*not Latest\*\*\./- [x] publish GitHub Release as **Pre-release** and **not Latest**./' /tmp/release-notes.md

          gh release edit "$TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.md \
            --prerelease

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '{tag_name, name, prerelease, draft, target_commitish}'
