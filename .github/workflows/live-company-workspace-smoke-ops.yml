name: Live Company Workspace Smoke Ops

on:
  push:
    branches:
      - ops/live-company-workspace-smoke-2026-08-14

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exercise live Company Workspace lifecycle
        shell: bash
        run: |
          set -euo pipefail

          base="https://growwithhr.onrender.com"
          report_id="GWHR-2026-0814-QA99"
          next_report_id="GWHR-2026-0814-QB99"
          smoke_email="workspace-smoke@example.invalid"

          create_body="$(curl -fsS --connect-timeout 20 --max-time 60 \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
              --arg reportId "$report_id" \
              --arg email "$smoke_email" \
              '{reportId:$reportId,email:$email,companyName:"GrowWithHR Workspace Smoke Test",completedEngine:"compliance",companyData:{shared:{companyName:"GrowWithHR Workspace Smoke Test",employees:11},compliance:{answers:{entity:"Private Limited",primaryState:"Karnataka"}}}}')" \
            "$base/api/company-workspace/create")"

          jq -e --arg reportId "$report_id" '
            .ok == true and
            .workspace.reportId == $reportId and
            (.workspace.accessKey | type == "string" and length >= 20) and
            (.workspace.completedEngines | index("compliance") != null)
          ' <<<"$create_body" >/dev/null

          access_key="$(jq -r '.workspace.accessKey' <<<"$create_body")"
          echo "::add-mask::$access_key"

          recover_body="$(curl -fsS --connect-timeout 20 --max-time 60 \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg reportId "$report_id" --arg accessKey "$access_key" '{reportId:$reportId,accessKey:$accessKey}')" \
            "$base/api/company-workspace/recover")"

          jq -e '
            .ok == true and
            .workspace.companyData.shared.companyName == "GrowWithHR Workspace Smoke Test" and
            .workspace.companyData.shared.employees == 11 and
            .workspace.companyData.compliance.answers.entity == "Private Limited"
          ' <<<"$recover_body" >/dev/null

          complete_body="$(curl -fsS --connect-timeout 20 --max-time 60 \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
              --arg reportId "$report_id" \
              --arg newReportId "$next_report_id" \
              --arg accessKey "$access_key" \
              '{reportId:$reportId,newReportId:$newReportId,accessKey:$accessKey,companyName:"GrowWithHR Workspace Smoke Test",completedEngine:"organization",companyData:{shared:{employees:12},organization:{managerCount:3}}}')" \
            "$base/api/company-workspace/complete")"

          jq -e --arg first "$report_id" --arg second "$next_report_id" '
            .ok == true and
            .workspace.reportId == $second and
            (.workspace.reportIds | index($first) != null) and
            (.workspace.reportIds | index($second) != null) and
            (.workspace.completedEngines | index("compliance") != null) and
            (.workspace.completedEngines | index("organization") != null) and
            .workspace.companyData.shared.companyName == "GrowWithHR Workspace Smoke Test" and
            .workspace.companyData.shared.employees == 12 and
            .workspace.companyData.compliance.answers.entity == "Private Limited" and
            .workspace.companyData.organization.managerCount == 3
          ' <<<"$complete_body" >/dev/null

          echo "Workspace create/recover/cross-engine merge passed; waiting for smoke email neutralization."
          sleep 60

          delete_body="$(curl -fsS --connect-timeout 20 --max-time 60 \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg reportId "$next_report_id" --arg accessKey "$access_key" '{reportId:$reportId,accessKey:$accessKey}')" \
            "$base/api/company-workspace/delete")"

          jq -e --arg reportId "$next_report_id" '
            .ok == true and .deleted == true and .reportId == $reportId
          ' <<<"$delete_body" >/dev/null

          post_delete_code="$(curl -sS -o /tmp/workspace-recover-after-delete.json -w '%{http_code}' \
            --connect-timeout 20 --max-time 60 \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg reportId "$next_report_id" --arg accessKey "$access_key" '{reportId:$reportId,accessKey:$accessKey}')" \
            "$base/api/company-workspace/recover")"

          test "$post_delete_code" = "404"
          echo "Live Company Workspace lifecycle smoke passed."
