name: Deferred Account Report Recovery Prototype

# Password-account work is intentionally deferred while GrowWithHR follows the
# zero-cost Report ID + Recovery Code prototype. Keep this workflow available for
# manual future validation without running stale account checks on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deferred-account-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check deferred backend account report service
        run: node --check server-account-report-service.js
      - name: Run deferred account report recovery contracts
        run: node tests/account-report-recovery-prototype-checks.mjs
