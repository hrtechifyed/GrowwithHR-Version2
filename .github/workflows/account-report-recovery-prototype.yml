name: Account Report Recovery Prototype

on:
  push:
    branches:
      - prototype/account-org-growth-workflow-v1
  pull_request:
    paths:
      - 'server-account-report-service.js'
      - 'server-entry.js'
      - 'js/auth-client.js'
      - 'js/my-growwithhr.js'
      - 'js/account-report.js'
      - 'my-growwithhr.html'
      - 'account-report.html'
      - 'supabase/migrations/20260823_account_workspace_prototype.sql'
      - 'tests/account-report-recovery-prototype-checks.mjs'
      - '.github/workflows/account-report-recovery-prototype.yml'

jobs:
  prototype-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check account report service
        run: node --check server-account-report-service.js
      - name: Syntax check account browser modules
        run: |
          node --check js/auth-client.js
          node --check js/my-growwithhr.js
          node --check js/account-report.js
      - name: Run account report recovery contracts
        run: node tests/account-report-recovery-prototype-checks.mjs
