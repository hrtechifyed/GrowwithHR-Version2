name: Prototype Version Sync Helper

on:
  push:
    branches:
      - agent/prototype-release-v0.20.3-2026-08-11

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/prototype-release-v0.20.3-2026-08-11
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Synchronize version metadata
        run: npm run version:sync

      - name: Commit generated version updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Version metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config/app-config.js '*.html'
          git commit -m "Sync v0.20.3-prototype.1 version metadata"
          git push origin HEAD:agent/prototype-release-v0.20.3-2026-08-11
