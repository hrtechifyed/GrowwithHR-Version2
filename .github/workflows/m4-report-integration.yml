name: M4 Report Integration

on:
  pull_request:
    paths:
      - "js/pdf-law-transparency.js"
      - "js/industry-adaptive-assessment.js"
      - "js/company-applicability-orchestrator-v1.js"
      - "js/founder-web-report-v2.js"
      - "js/report-runtime-bootstrap.js"
      - "js/report-runtime-corrections.js"
      - "js/report-acceptance-corrections.js"
      - "js/report-sequence-controller.js"
      - "js/report-founder-summary-corrections.js"
      - "js/report-intelligence-v020-fixes.js"
      - "js/report-context-question-ui-fixes.js"
      - "js/sector-context-intelligence-v020.js"
      - "js/sector-context-intelligence-v020-patch.js"
      - "js/story-visual-sections-v021.js"
      - "js/report-visual-core-v021.js"
      - "js/report-visual-renderers-v021.js"
      - "js/report-founder-intelligence-parity-v1.js"
      - "js/report-visual-sections-v021.js"
      - "js/report-identity-v1.js"
      - "css/21-story-visual-sections.css"
      - "server-entry.js"
      - "server-m4-delivery.js"
      - "server-report-id-registry.js"
      - "cloudflare/report-id-worker/**"
      - "wrangler.jsonc"
      - "tests/m4-law-transparency-combination-checks.mjs"
      - "tests/m4-report-integration-checks.mjs"
      - "tests/company-applicability-orchestrator-checks.mjs"
      - "tests/founder-intelligence-golden-scenarios.mjs"
      - "tests/report-id-cloudflare-durable-object-checks.mjs"
      - "tests/industry-adaptive-assessment-checks.mjs"
      - "tests/report-runtime-corrections-checks.mjs"
      - "tests/report-sequence-controller-checks.mjs"
      - "tests/report-acceptance-corrections-checks.mjs"
      - "tests/visual-story-report-v021-checks.mjs"
      - "docs/architecture/company-applicability-and-scale-triggers.md"
      - "docs/architecture/founder-report-and-id-registry.md"
      - "docs/releases/v0.20.0-integrated-report-industry-profiles.md"
      - "docs/releases/v0.23.0-founder-first-report.md"
      - ".github/workflows/m4-report-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate M4 report integration syntax
        run: |
          node --check js/pdf-law-transparency.js
          node --check js/industry-adaptive-assessment.js
          node --check js/company-applicability-orchestrator-v1.js
          node --check js/founder-web-report-v2.js
          node --check js/report-runtime-bootstrap.js
          node --check js/report-runtime-corrections.js
          node --check js/report-acceptance-corrections.js
          node --check js/report-sequence-controller.js
          node --check js/report-founder-summary-corrections.js
          node --check js/story-visual-sections-v021.js
          node --check js/report-visual-core-v021.js
          node --check js/report-visual-renderers-v021.js
          node --check js/report-founder-intelligence-parity-v1.js
          node --check js/report-visual-sections-v021.js
          node --check js/report-identity-v1.js
          node --check server-entry.js
          node --check server-m4-delivery.js
          node --check server-report-id-registry.js
          node --check cloudflare/report-id-worker/src/index.mjs
          node --check tests/m4-report-integration-checks.mjs
          node --check tests/company-applicability-orchestrator-checks.mjs
          node --check tests/founder-intelligence-golden-scenarios.mjs
          node --check tests/report-id-cloudflare-durable-object-checks.mjs
          node --check tests/industry-adaptive-assessment-checks.mjs
          node --check tests/report-runtime-corrections-checks.mjs
          node --check tests/report-sequence-controller-checks.mjs
          node --check tests/report-acceptance-corrections-checks.mjs
          node --check tests/visual-story-report-v021-checks.mjs
      - name: Run client readiness contract
        run: npm run test:client-readiness
      - name: Run server CORS contract
        run: npm run test:server-cors
      - name: Run email signature contract
        run: npm run test:email-signature
      - name: Run operating footprint contract
        run: npm run test:footprint-priorities
      - name: Run exhaustive law transparency combinations
        run: node tests/m4-law-transparency-combination-checks.mjs
      - name: Run company-wide applicability and Scale Trigger Matrix contracts
        run: node tests/company-applicability-orchestrator-checks.mjs
      - name: Run founder intelligence golden scenarios
        run: node tests/founder-intelligence-golden-scenarios.mjs
      - name: Run industry-adaptive assessment contracts
        run: node tests/industry-adaptive-assessment-checks.mjs
      - name: Run report runtime correction contracts
        run: node tests/report-runtime-corrections-checks.mjs
      - name: Run report sequence and work-model lock contracts
        run: node tests/report-sequence-controller-checks.mjs
      - name: Run report acceptance correction contracts
        run: node tests/report-acceptance-corrections-checks.mjs
      - name: Run visual story and report contracts
        run: node tests/visual-story-report-v021-checks.mjs
      - name: Run durable Report ID and lineage contracts
        run: node tests/report-id-cloudflare-durable-object-checks.mjs
      - name: Run M4 visible report and delivery contracts
        run: node tests/m4-report-integration-checks.mjs
