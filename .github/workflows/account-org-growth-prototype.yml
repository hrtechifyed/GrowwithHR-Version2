name: Zero-Cost GrowWithHR Prototype Checks

on:
  push:
    branches:
      - prototype/account-org-growth-workflow-v1
  pull_request:
    branches:
      - main
    paths:
      - 'intelligence-hub.html'
      - 'my-reports.html'
      - 'compliance-report-recover.html'
      - 'executive-advisory-report.html'
      - 'organization-growth-beta.html'
      - 'organization-growth-report-beta.html'
      - 'css/26-account-org-growth-prototype.css'
      - 'js/auth-guard.js'
      - 'js/compliance-account-bridge.js'
      - 'js/compliance-zero-cost-report-bridge.mjs'
      - 'js/compliance-report-recover.mjs'
      - 'js/my-reports-zero-cost.mjs'
      - 'js/zero-cost-report-vault.mjs'
      - 'js/organization-growth-beta.mjs'
      - 'js/organization-growth-zero-cost.mjs'
      - 'js/organization-growth-report-beta.mjs'
      - 'js/organization-growth-report-zero-cost.mjs'
      - 'js/modules/organization/organization-growth-*.mjs'
      - 'supabase/config.toml'
      - 'supabase/functions/growwithhr-prototype-report-vault/**'
      - 'supabase/migrations/20260823_zero_cost_report_vault_prototype.sql'
      - 'tests/zero-cost-prototype-checks.mjs'
      - '.github/workflows/account-org-growth-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check zero-cost browser modules
        run: |
          node --check js/zero-cost-report-vault.mjs
          node --check js/organization-growth-beta.mjs
          node --check js/organization-growth-zero-cost.mjs
          node --check js/organization-growth-report-beta.mjs
          node --check js/organization-growth-report-zero-cost.mjs
          node --check js/compliance-zero-cost-report-bridge.mjs
          node --check js/compliance-report-recover.mjs
          node --check js/my-reports-zero-cost.mjs
          node --check js/auth-guard.js
          node --check js/compliance-account-bridge.js

      - name: Run zero-cost prototype contract checks
        run: node tests/zero-cost-prototype-checks.mjs
