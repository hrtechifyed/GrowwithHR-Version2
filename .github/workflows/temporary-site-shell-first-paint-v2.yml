name: Temporary Site Shell First Paint V2

on:
  push:
    branches:
      - fix/site-shell-first-paint-and-org-headcount

permissions:
  contents: write

jobs:
  rewrite-shell-loaders:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-shell-first-paint-and-org-headcount
      - name: Move shared shell loader into head with defer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          script_pattern = re.compile(
              r'<script\b(?=[^>]*\bsrc=["\'](?P<src>[^"\']*js/site-shell\.js(?:[?#][^"\']*)?)["\'])[^>]*>\s*</script>',
              re.IGNORECASE,
          )
          changed = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules', 'archive', 'archives'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              matches = list(script_pattern.finditer(text))
              if not matches:
                  continue
              src = matches[0].group('src')
              stripped = script_pattern.sub('', text)
              loader = f'  <script src="{src}" defer></script>\n'
              rewritten, count = re.subn(r'</head>', loader + '</head>', stripped, count=1, flags=re.IGNORECASE)
              if count != 1:
                  raise SystemExit(f'{path}: could not insert site shell loader in head')
              if rewritten != text:
                  path.write_text(rewritten, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No late site shell loaders required rewriting.')
          print('Rewrote:')
          print('\n'.join(changed))
          PY

          git rm .github/workflows/temporary-site-shell-first-paint-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Load shared navigation before first paint"
          git push origin HEAD:fix/site-shell-first-paint-and-org-headcount
