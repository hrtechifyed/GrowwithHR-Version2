# Wave 5A includes Appropriate Government cross-code source-routing controls.
name: All-Laws RAG Private Beta

on:
  pull_request:
    paths:
      - "data/legal-source-governance/all-laws-rag-onboarding.v1.json"
      - "data/legal-source-governance/appropriate-government-*.json"
      - "data/assessment/appropriate-government-*.json"
      - "growwithhr-rag/all-laws-onboarding.cjs"
      - "growwithhr-rag/manifests/candidates/**"
      - "growwithhr-rag/data/epf-wave3a-source-chunks.v1.json"
      - "growwithhr-rag/data/epf-wave3b-source-chunks.v1.json"
      - "growwithhr-rag/data/epf-wave3c-source-chunks.v1.json"
      - "growwithhr-rag/data/esi-wave4a-source-chunks.v1.json"
      - "growwithhr-rag/data/esi-wave4b-source-chunks.v1.json"
      - "growwithhr-rag/data/esi-wave4c-source-chunks.v1.json"
      - "growwithhr-rag/data/esi-wave4d-source-chunks.v1.json"
      - "growwithhr-rag/data/jurisdiction-wave5a-source-chunks.v1.json"
      - "server-all-laws-*.js"
      - "server-epf-wave3a-*.js"
      - "server-epf-wave3b-*.js"
      - "server-epf-wave3c-*.js"
      - "server-esi-wave4a-*.js"
      - "server-esi-wave4b-*.js"
      - "server-esi-wave4c-*.js"
      - "server-esi-wave4d-*.js"
      - "server-jurisdiction-wave5a-*.js"
      - "server-legal-explanation-router.js"
      - "server-legal-explanation-router-wave3a.js"
      - "server-legal-explanation-router-wave3b.js"
      - "server-legal-explanation-router-wave3c.js"
      - "server-legal-explanation-router-wave4a.js"
      - "server-legal-explanation-router-wave4b.js"
      - "server-legal-explanation-router-wave4c.js"
      - "server-legal-explanation-router-wave4d.js"
      - "server-legal-explanation-router-wave5a.js"
      - "server-legal-rag-catalogs.js"
      - "js/assessment-v3/epf-wave3a-*.js"
      - "js/assessment-v3/epf-wave3b-*.js"
      - "js/assessment-v3/epf-wave3c-*.js"
      - "js/assessment-v3/esi-wave4a-*.js"
      - "js/assessment-v3/esi-wave4b-*.js"
      - "js/assessment-v3/esi-wave4c-*.js"
      - "js/assessment-v3/esi-wave4d-*.js"
      - "js/assessment-v3/jurisdiction-wave5a-*.js"
      - "tests/all-laws-*.mjs"
      - "tests/epf-wave3a-*.mjs"
      - "tests/epf-wave3b-*.mjs"
      - "tests/epf-wave3c-*.mjs"
      - "tests/esi-wave4a-*.mjs"
      - "tests/esi-wave4b-*.mjs"
      - "tests/esi-wave4c-*.mjs"
      - "tests/esi-wave4d-*.mjs"
      - "tests/jurisdiction-wave5a-*.mjs"
      - "tests/legal-rag-catalog-loader-checks.mjs"
      - "package.json"
      - ".github/workflows/all-laws-rag-private-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-laws-rag:
    name: Validate every runnable profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate all-laws onboarding registry
        run: npm run test:all-laws-rag-onboarding

      - name: Validate Wave 1 and Wave 2 baseline profiles
        run: npm run test:all-laws-runnable-private-beta

      - name: Validate EPF Wave 3A overlay
        run: node tests/epf-wave3a-private-beta-checks.mjs

      - name: Validate EPF Wave 3B overlay
        run: node tests/epf-wave3b-private-beta-checks.mjs

      - name: Validate EPF Wave 3C overlay
        run: node tests/epf-wave3c-private-beta-checks.mjs

      - name: Validate ESI Wave 4A overlay
        run: node tests/esi-wave4a-private-beta-checks.mjs

      - name: Validate ESI Wave 4B overlay
        run: node tests/esi-wave4b-private-beta-checks.mjs

      - name: Validate ESI Wave 4C overlay
        run: node tests/esi-wave4c-private-beta-checks.mjs

      - name: Validate ESI Wave 4D overlay
        run: node tests/esi-wave4d-private-beta-checks.mjs

      - name: Validate jurisdiction Wave 5A overlay
        run: node tests/jurisdiction-wave5a-private-beta-checks.mjs

      - name: Run complete legal RAG regression suite
        run: npm run test:complete-legal-rag-platform
