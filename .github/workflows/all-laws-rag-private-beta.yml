permissions:
  contents: read

jobs:
  all-laws-rag:
    name: Validate every runnable profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate all-laws onboarding registry
        run: npm run test:all-laws-rag-onboarding

      - name: Validate Wave 1 and Wave 2 baseline profiles
        run: npm run test:all-laws-runnable-private-beta

      - name: Validate EPF Wave 3A overlay
        run: node tests/epf-wave3a-private-beta-checks.mjs

      - name: Validate EPF Wave 3B overlay
        run: node tests/epf-wave3b-private-beta-checks.mjs

      - name: Validate EPF Wave 3C overlay
        run: node tests/epf-wave3c-private-beta-checks.mjs

      - name: Validate ESI Wave 4A overlay
        run: node tests/esi-wave4a-private-beta-checks.mjs

      - name: Validate ESI Wave 4B overlay
        run: node tests/esi-wave4b-private-beta-checks.mjs

      - name: Validate ESI Wave 4C overlay
        run: node tests/esi-wave4c-private-beta-checks.mjs

      - name: Validate ESI Wave 4D overlay
        run: node tests/esi-wave4d-private-beta-checks.mjs

      - name: Validate jurisdiction Wave 5A overlay
        run: node tests/jurisdiction-wave5a-private-beta-checks.mjs

      - name: Validate Maharashtra Shops Wave 5B overlay
        run: node tests/shops-wave5b-private-beta-checks.mjs

      - name: Validate Code on Wages Wave 5C overlay
        run: node tests/code-on-wages-wave5c-private-beta-checks.mjs

      - name: Validate Gratuity Wave 5D overlay
        run: node tests/gratuity-wave5d-private-beta-checks.mjs

      - name: Validate Employee Compensation Wave 5E overlay
        run: node tests/employee-compensation-wave5e-private-beta-checks.mjs

      - name: Validate OSHWC Wave 5F overlay
        run: node tests/oshwc-wave5f-private-beta-checks.mjs

      - name: Validate Industrial Relations Wave 5G overlay
        run: node tests/industrial-relations-wave5g-private-beta-checks.mjs

      - name: Validate Apprentices Wave 5H overlay
        run: node tests/apprentices-wave5h-private-beta-checks.mjs

      - name: Validate Child and Adolescent Labour Wave 5I overlay
        run: node tests/child-adolescent-labour-wave5i-private-beta-checks.mjs

      - name: Validate Bonded and Forced Labour Wave 5J research-only boundary
        run: node tests/bonded-forced-labour-wave5j-research-governance-checks.mjs

      - name: Validate Contract Workforce Wave 5K overlay
        run: node tests/contract-workforce-wave5k-private-beta-checks.mjs

      - name: Validate Social Security Wave 5L overlay
        run: node tests/social-security-wave5l-private-beta-checks.mjs

      - name: Run complete legal RAG regression suite
        run: npm run test:complete-legal-rag-platform
