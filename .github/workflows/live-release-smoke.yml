name: Live Release Smoke

on:
  push:
    branches:
      - main
    paths-ignore:
      - data/releases/*-live-smoke.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-release-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          url="${PAGES_BASE_URL}/index.html?growwithhr_commit=${GITHUB_SHA}"
          expected_sha="$(sha256sum index.html | cut -d' ' -f1)"
          for attempt in $(seq 1 60); do
            if curl -fsSL --connect-timeout 15 --max-time 45 "$url" -o /tmp/github-pages-index.html 2>/dev/null && \
               printf '%s  %s\n' "$expected_sha" /tmp/github-pages-index.html | sha256sum --check --status; then
              echo "GitHub Pages exposes the expected index.html content for commit ${GITHUB_SHA}."
              exit 0
            fi
            echo "GitHub Pages not updated yet (attempt $attempt/60)."
            sleep 10
          done
          echo "GitHub Pages did not expose the expected index.html content for commit ${GITHUB_SHA} within the smoke window." >&2
          exit 1

      - name: Validate GitHub Pages founder report route
        shell: bash
        run: |
          set -euo pipefail
          url="${PAGES_BASE_URL}/executive-advisory-report.html"
          body="$(curl -fsSL --connect-timeout 15 --max-time 45 "$url")"
          grep -Fq "HR Compliance & Growth Report" <<<"$body"
          grep -Fq 'id="founderReportRoot"' <<<"$body"
          if grep -Fq "Dark Version" <<<"$body"; then
            echo "Dark report option is still visible on the founder report route." >&2
            exit 1
          fi

      - name: Wait for Render homepage release
        shell: bash
        run: |
          set -euo pipefail
          url="https://growwithhr.onrender.com/index.html?growwithhr_commit=${GITHUB_SHA}"
          expected_sha="$(sha256sum index.html | cut -d' ' -f1)"
          for attempt in $(seq 1 60); do
            if curl -fsSL --connect-timeout 20 --max-time 60 "$url" -o /tmp/render-index.html 2>/dev/null && \
               printf '%s  %s\n' "$expected_sha" /tmp/render-index.html | sha256sum --check --status; then
              echo "Render exposes the expected index.html content for commit ${GITHUB_SHA}."
              exit 0
            fi
            echo "Render homepage not updated yet (attempt $attempt/60)."
            sleep 10
          done
          echo "Render did not expose the expected index.html content for commit ${GITHUB_SHA} within the smoke window." >&2
          exit 1

      - name: Validate Render founder report route
        shell: bash
        run: |
          set -euo pipefail
          url="https://growwithhr.onrender.com/executive-advisory-report.html"
          body="$(curl -fsSL --connect-timeout 20 --max-time 60 "$url")"
          grep -Fq "HR Compliance & Growth Report" <<<"$body"
          grep -Fq 'id="founderReportRoot"' <<<"$body"
          if grep -Fq "Dark Version" <<<"$body"; then
            echo "Dark report option is still visible on the Render founder report route." >&2
            exit 1
          fi

      - name: Validate live report ID registry durability
        shell: bash
        run: |
          set -euo pipefail
          url="https://growwithhr.onrender.com/api/report-id/status"
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --connect-timeout 20 --max-time 60 "$url" 2>/dev/null || true)"
            if jq -e '.ok == true and .storageBackend == "cloudflare-durable-object" and .sequencePolicy == "global-non-resetting-symmetric-alpha-numeric" and .durableStorageConfigured == true' <<<"$body" >/dev/null 2>&1; then
              echo "$body" > /tmp/report-id-status.json
              echo "Cloudflare Durable Object report ID registry is configured."
              exit 0
            fi
            echo "Cloudflare durable Report ID registry is not ready yet (attempt $attempt/30)."
            sleep 10
          done
          echo "Render report ID status did not confirm storageBackend=cloudflare-durable-object and durableStorageConfigured=true." >&2
          exit 1

      - name: Validate live legal RAG status
        shell: bash
        run: |
          set -euo pipefail
          url="https://growwithhr.onrender.com/api/legal-rag/status"
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --connect-timeout 20 --max-time 60 "$url" 2>/dev/null || true)"
            if grep -Fq '"platformStatus":"all-laws-runnable-private-beta"' <<<"$body" && \
               grep -Fq '"activeProfileCount":57' <<<"$body" && \
               grep -Fq '"blockedProfileCount":0' <<<"$body"; then
              echo "Live legal RAG status is valid."
              exit 0
            fi
            echo "Legal RAG status not ready yet (attempt $attempt/30)."
            sleep 10
          done
          echo "Live legal RAG status did not meet the prototype contract." >&2
          exit 1

      - name: Archive successful smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/releases
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          issued_count="$(jq -r '.issuedCount // 0' /tmp/report-id-status.json)"
          last_report_id="$(jq -r '.lastReportId // ""' /tmp/report-id-status.json)"
          last_suffix="$(jq -r '.lastSuffix // ""' /tmp/report-id-status.json)"
          storage_backend="$(jq -r '.storageBackend // ""' /tmp/report-id-status.json)"
          cat > data/releases/v0.20.4-prototype.1-live-smoke.json <<EOF
          {
            "releaseVersion": "0.20.4-prototype.1",
            "checkedAt": "$checked_at",
            "sourceCommitSha": "${GITHUB_SHA}",
            "status": "passed",
            "checks": {
              "githubPagesHomepage": {
                "url": "${PAGES_BASE_URL}/index.html",
                "versionVisible": true
              },
              "githubPagesFounderReport": {
                "url": "${PAGES_BASE_URL}/executive-advisory-report.html",
                "singleReportRouteVisible": true,
                "darkReportOptionAbsent": true
              },
              "renderHomepage": {
                "url": "https://growwithhr.onrender.com/index.html",
                "versionVisible": true
              },
              "renderFounderReport": {
                "url": "https://growwithhr.onrender.com/executive-advisory-report.html",
                "singleReportRouteVisible": true,
                "darkReportOptionAbsent": true
              },
              "reportIdRegistry": {
                "url": "https://growwithhr.onrender.com/api/report-id/status",
                "storageBackend": "$storage_backend",
                "durableStorageConfigured": true,
                "sequencePolicy": "global-non-resetting-symmetric-alpha-numeric",
                "issuedCount": $issued_count,
                "lastReportId": "$last_report_id",
                "lastSuffix": "$last_suffix"
              },
              "legalRagStatus": {
                "url": "https://growwithhr.onrender.com/api/legal-rag/status",
                "platformStatus": "all-laws-runnable-private-beta",
                "activeProfileCount": 57,
                "blockedProfileCount": 0
              }
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases/v0.20.4-prototype.1-live-smoke.json
          git commit -m "Archive v0.20.4 prototype live smoke evidence"
          git push origin HEAD:main
