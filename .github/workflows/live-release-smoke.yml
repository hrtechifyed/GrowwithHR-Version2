name: Live Release Smoke

on:
  push:
    branches:
      - main
    paths-ignore:
      - data/releases/v0.20.2-live-smoke.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-release-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          url="https://hrtechifyed.github.io/GrowwithHR-Version2/index.html"
          for attempt in $(seq 1 60); do
            body="$(curl -fsSL --connect-timeout 15 --max-time 45 "$url" 2>/dev/null || true)"
            if grep -Fq "How GrowWithHR reaches a compliance answer" <<<"$body" && grep -Fq "GrowWithHR Public 0.20.2" <<<"$body"; then
              echo "GitHub Pages v0.20.2 is live."
              exit 0
            fi
            echo "GitHub Pages not updated yet (attempt $attempt/60)."
            sleep 10
          done
          echo "GitHub Pages did not expose v0.20.2 within the smoke window." >&2
          exit 1

      - name: Wait for Render homepage release
        shell: bash
        run: |
          set -euo pipefail
          url="https://growwithhr.onrender.com/index.html"
          for attempt in $(seq 1 60); do
            body="$(curl -fsSL --connect-timeout 20 --max-time 60 "$url" 2>/dev/null || true)"
            if grep -Fq "How GrowWithHR reaches a compliance answer" <<<"$body" && grep -Fq "GrowWithHR Public 0.20.2" <<<"$body"; then
              echo "Render homepage v0.20.2 is live."
              exit 0
            fi
            echo "Render homepage not updated yet (attempt $attempt/60)."
            sleep 10
          done
          echo "Render homepage did not expose v0.20.2 within the smoke window." >&2
          exit 1

      - name: Validate live legal RAG status
        shell: bash
        run: |
          set -euo pipefail
          url="https://growwithhr.onrender.com/api/legal-rag/status"
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --connect-timeout 20 --max-time 60 "$url" 2>/dev/null || true)"
            if grep -Fq '"platformStatus":"all-laws-runnable-private-beta"' <<<"$body" && \
               grep -Fq '"activeProfileCount":57' <<<"$body" && \
               grep -Fq '"blockedProfileCount":0' <<<"$body"; then
              echo "Live legal RAG status is valid."
              exit 0
            fi
            echo "Legal RAG status not ready yet (attempt $attempt/30)."
            sleep 10
          done
          echo "Live legal RAG status did not meet the v0.20.2 contract." >&2
          exit 1

      - name: Archive successful smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/releases
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > data/releases/v0.20.2-live-smoke.json <<EOF
          {
            "releaseVersion": "0.20.2",
            "checkedAt": "$checked_at",
            "sourceCommitSha": "${GITHUB_SHA}",
            "status": "passed",
            "checks": {
              "githubPagesHomepage": {
                "url": "https://hrtechifyed.github.io/GrowwithHR-Version2/index.html",
                "versionVisible": true,
                "complianceEngineSectionVisible": true
              },
              "renderHomepage": {
                "url": "https://growwithhr.onrender.com/index.html",
                "versionVisible": true,
                "complianceEngineSectionVisible": true
              },
              "legalRagStatus": {
                "url": "https://growwithhr.onrender.com/api/legal-rag/status",
                "platformStatus": "all-laws-runnable-private-beta",
                "activeProfileCount": 57,
                "blockedProfileCount": 0
              }
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases/v0.20.2-live-smoke.json
          git commit -m "Archive v0.20.2 live smoke evidence"
          git push origin HEAD:main
