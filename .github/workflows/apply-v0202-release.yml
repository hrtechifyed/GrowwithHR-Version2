name: Apply v0.20.2 Release Updates

on:
  push:
    branches:
      - agent/all-laws-governed-rag-onboarding
    paths:
      - scripts/apply-v0202-release.mjs
      - .github/workflows/apply-v0202-release.yml

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/all-laws-governed-rag-onboarding
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply release transformation
        run: node scripts/apply-v0202-release.mjs

      - name: Commit generated release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated release changes."
            exit 0
          fi
          git commit -m "Release v0.20.2 governed legal RAG private beta"
          git push origin HEAD:agent/all-laws-governed-rag-onboarding
