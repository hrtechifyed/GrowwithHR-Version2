<!DOCTYPE html>
<html lang="en">

    <meta name="description" content="Founder-facing HR compliance applicability and growth report generated by GrowWithHR.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/24-founder-compliance-report.css">

<body class="founder-report-page" data-active-nav="sample">

        <div class="gwh-web-shell" id="founderReportRoot" aria-live="polite">

    <script src="js/report-experience-v019.js"></script>
    <script src="js/report-runtime-bootstrap.js"></script>

    <script src="js/site-shell.js"></script>
    <script src="js/build-marker.js"></script>
    <script src="js/founder-web-report-v2.js"></script>
