<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stop Compliance Review Reminders | GrowWithHR</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="js/site-shell.js" defer></script>
<style>
.reminder-unsubscribe{max-width:680px;margin:7rem auto 4rem;padding:30px;border:1px solid #d9aa53;border-radius:18px;background:#201c1b;color:#fff8ea}
.reminder-unsubscribe h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.15}
.reminder-unsubscribe p{line-height:1.65;color:#ebddd2}
.reminder-unsubscribe button{min-height:48px;padding:12px 22px;background:#ffcf51;color:#221900;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.reminder-unsubscribe button:disabled{opacity:.6}
.reminder-unsubscribe [role="status"]{margin-top:14px;overflow-wrap:anywhere}
@media(max-width:680px){.reminder-unsubscribe{margin:6rem 16px 3rem;padding:20px}}
</style>
</head>
<body data-active-nav="more">
<main class="site-shell-main">
<section class="reminder-unsubscribe" aria-labelledby="unsubscribeTitle">
<p>GROWWITHHR · EMAIL PREFERENCES</p>
<h1 id="unsubscribeTitle">Stop HR Compliance Readiness review reminders</h1>
<p>This will stop optional review emails linked to your last completed assessment. It will not delete your reports or change separate workspace-data retention notices.</p>
<button type="button" id="stopReminderButton" disabled>Stop review reminders</button>
<p id="reminderPreferenceStatus" role="status" aria-live="polite">Checking your unsubscribe link…</p>
<p><a href="index.html">Return to GrowWithHR</a></p>
</section>
</main>
<script src="js/reminder-preferences.js" defer></script>
