<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | GrowWithHR</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/26-account-org-growth-prototype.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/site-shell.js" defer></script>
</head>
<body data-active-nav="account">
  <main class="auth-layout" style="grid-template-columns:1fr;max-width:700px">
    <section class="prototype-panel">
      <div class="prototype-kicker">GrowWithHR Account · Prototype</div>
      <h1>Reset your password</h1>
      <p class="prototype-lead">Choose a new password for your GrowWithHR account. This page should be opened from the secure reset link sent to your email.</p>
      <form id="resetPasswordForm" class="prototype-form">
        <div class="prototype-field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="prototype-field"><label for="confirmNewPassword">Confirm new password</label><input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="prototype-btn" type="submit">Reset password</button>
      </form>
      <p id="resetStatus" class="prototype-status" role="status" aria-live="polite"></p>
      <p><a href="auth.html">Back to sign in →</a></p>
    </section>
  </main>
  <script type="module" src="js/reset-password-page.js"></script>
</body>
</html>
